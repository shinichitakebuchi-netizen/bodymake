<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BODY CONTROL">
<title>BODY CONTROL</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: 1カラム(最大560px)・下部5タブ・カードは面の明度差だけで区切る。数字は大きく、ラベルは小さく。 */
  --bg:#0c0d0e; --surface:#151718; --surface2:#1d2022; --line:#2a2e30;
  --text:#eef1ee; --muted:#8a928d; --accent:#3ecf8e; --accent-dim:#1f3a2f;
  --amber:#e2b04a; --red:#e5645c;
  --num:"Barlow Semi Condensed","SF Pro Display","Helvetica Neue",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 92px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.brand{font-family:var(--num);font-weight:600;letter-spacing:.18em;font-size:13px;color:var(--muted)}
.brand b{color:var(--accent);font-weight:600}
.datebar{display:flex;align-items:center;gap:4px}
.datebar button{width:40px;height:40px;border-radius:12px;color:var(--muted);font-size:20px}
.datebar .d{position:relative;font-weight:600;padding:8px 10px;border-radius:12px;background:var(--surface);min-width:132px;text-align:center}
.datebar .d input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.datebar .t{width:auto;padding:0 10px;font-size:12px;color:var(--accent)}
.card{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:12px}
.h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em}
.h .more{color:var(--accent);font-size:12px;letter-spacing:0;padding:6px 0}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat .num{font-size:24px;line-height:1.15}
.stat .u{font-size:12px;color:var(--muted);font-family:var(--body);font-weight:400;margin-left:2px}
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c .num{font-size:30px;line-height:1}
.ring .c small{color:var(--muted);font-size:11px}
.hero h1{margin:0 0 4px;font-size:19px;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--text)}
.chip.on{background:var(--accent-dim);color:var(--accent)}
.chip.amber{background:#3a3020;color:var(--amber)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.up{background:var(--accent-dim);color:var(--accent)}
.tag.est{background:#3a3020;color:var(--amber)}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar i.over{background:var(--amber)}
.macro{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;align-items:center;margin-top:12px}
.macro .l{font-size:13px}
.macro .v{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.macro .v b{font-family:var(--num);font-size:17px;color:var(--text);font-weight:600}
.kcal{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.kcal .num{font-size:36px;line-height:1}
.kcal span{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);min-height:48px}
.list .item:first-child{border-top:0}
.item .g{flex:1;min-width:0}
.item .g b{display:block;font-weight:600;overflow-wrap:anywhere}
.item .g small{color:var(--muted);font-size:12px;display:block}
.item .r{text-align:right;flex:none;font-size:12px;color:var(--muted)}
.item .r .num{display:block;font-size:17px;color:var(--text)}
.item img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700}
.check.on{background:var(--accent);border-color:var(--accent);color:#06130c}
.item .time{font-family:var(--num);font-size:13px;color:var(--muted);width:86px;flex:none}
.item input[type=time]{background:var(--surface2);border:0;border-radius:8px;padding:6px 6px;font-size:12px;width:92px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:14px;background:var(--surface2);font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);color:#06130c}
.btn.danger{color:var(--red)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.plus{width:36px;height:36px;border-radius:11px;background:var(--accent-dim);color:var(--accent);font-size:20px;line-height:1;flex:none}
.seg{display:flex;background:var(--surface);border-radius:13px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text)}
.empty{color:var(--muted);font-size:13px;margin:4px 0;padding:10px 0}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
.adv{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:12px 0 0}
.adv.amber{border-color:var(--amber)}
.adv b{display:block;font-size:14px}
.adv p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.adv .tag{margin-bottom:4px}
.banner{background:#2a2418;color:var(--amber);border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)}
.kv b{font-family:var(--num);font-size:16px;text-align:right}
.kv em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px;font-family:var(--body);font-weight:400}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:46px;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:10px 12px;font-size:16px}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--accent);outline:0}
.ck{display:flex;align-items:center;gap:10px;min-height:42px;font-size:14px}
.ck input{width:20px;height:20px;accent-color:var(--accent)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow label{font-size:14px;flex:1;min-width:0}
.setrow input,.setrow select{width:108px;min-height:42px;background:var(--surface2);border:1px solid transparent;border-radius:11px;padding:6px 10px;font-size:16px;text-align:right}
.setrow select{text-align:left;width:auto;max-width:150px}
.picklist{max-height:168px;overflow:auto;margin:0 0 12px;border-radius:12px;background:var(--surface2)}
.picklist button{display:block;width:100%;text-align:left;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.picklist button:first-child{border-top:0}
.picklist small{color:var(--muted);display:block;font-size:12px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--num)}
.legend{font-size:11px;color:var(--muted);margin:6px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(12,13,14,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:10px;color:var(--muted);min-height:58px}
nav button.on{color:var(--accent)}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-head h2{margin:0;font-size:17px}
.sh-head button{width:40px;height:40px;border-radius:12px;background:var(--surface2);font-size:18px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--text);color:#0c0d0e;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:20;max-width:90%;text-align:center}
@media (min-width:700px){#app{padding-top:28px}#ov{align-items:center}#sheet{border-radius:22px}}
@media (prefers-reduced-motion:no-preference){.bar i,.ring circle{transition:all .35s ease}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="brand">BODY <b>CONTROL</b></div><div id="datebar" class="datebar"></div></div>
  <main id="view"></main>
</div>
<nav><div class="in" id="nav"></div></nav>
<div id="ov" hidden><div id="sheet" role="dialog" aria-modal="true"><div class="sh-head"><h2 id="shT"></h2><button data-act="close" aria-label="閉じる">×</button></div><div id="shB"></div></div></div>
<div id="toast" hidden></div>
<script>
'use strict';
const VERSION='1.1.0', KEY='bodycontrol.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toDate=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const WD=['日','月','火','水','木','金','土'];
const fmtDate=s=>{const d=toDate(s);return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`};
const md=s=>{const d=toDate(s);return `${d.getMonth()+1}/${d.getDate()}`};
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(v);return isFinite(n)?n:null};
const r1=n=>Math.round(n*10)/10;
const kc=n=>Math.round(n).toLocaleString('ja-JP');
const sg=n=>(n>0?'+':'')+n;
const monday=s=>addDays(s,-((toDate(s).getDay()+6)%7));
const SLOTS=[{id:'s1',n:'朝食・筋トレ後'},{id:'s2',n:'昼食'},{id:'s3',n:'間食'},{id:'s4',n:'夕食'}];
const ROUTINE=[
 {id:'wake',time:'6:00〜6:30',label:'起床'},{id:'train',time:'7:00〜8:00',label:'筋トレ'},
 {id:'protein',time:'8:00〜8:15',label:'ソイプロテイン'},{id:'walk',time:'8:30〜9:30',label:'通勤ウォーキング'},
 {id:'lunch',time:'13:00',label:'昼食'},{id:'snack',time:'16:00',label:'間食'},
 {id:'leave',time:'18:00',label:'退勤（残業あり）'},{id:'dinner',time:'19:00〜19:30',label:'夕食'},
 {id:'sleep',time:'21:00〜22:00',label:'就寝'}];

/* ---------- データ ---------- */
function defaults(){
  const ex=[['スクワット',0],['ルーマニアンデッドリフト',0],['ブルガリアンスクワット',0],['レッグレイズ',0],['クランチ',0],['プランク',0],
    ['ベンチプレス',1],['ダンベルフライ',1],['ラットプルダウン',1],['ベントオーバーロー',0],['シーテッドロー',0],
    ['懸垂',1],['ダンベルカール',0],['ハンマーカール',0],['トライセプスプレスダウン',0]].map((a,i)=>({id:'e'+i,name:a[0],shoulder:!!a[1]}));
  const now=new Date();
  return {v:1,
    settings:{height:166,goalWeight:60,goalFat:10,waterGoal:2000,factorTrain:1.6,factorOff:1.45,shoulderPain:false,
      targets:{train:{kcal:1900,p:145,f:55,c:206},off:{kcal:1800,p:145,f:60,c:176}},
      week:[{type:'off',menuId:null},{type:'train',menuId:'m1'},{type:'off',menuId:null},{type:'train',menuId:'m2'},{type:'off',menuId:null},{type:'train',menuId:'m1'},{type:'train',menuId:'m3'}]},
    exercises:ex,
    menus:[{id:'m1',name:'下半身＋腹筋',ex:['e0','e1','e2','e3','e4','e5']},{id:'m2',name:'胸＋背中',ex:['e6','e7','e8','e9','e10']},{id:'m3',name:'背中＋腕',ex:['e11','e8','e10','e12','e13','e14']}],
    body:[{id:uid(),date:ymd(now),time:'',weight:68.6,fat:22.6,muscle:50.5,bmr:1439,waist:null,initial:true}],
    meals:{},foods:[],workouts:[],days:{}};
}
let storeOK=true;
function load(){
  try{const t=localStorage.getItem(KEY);if(t)return migrate(JSON.parse(t))}catch(e){storeOK=false}
  return defaults();
}
function migrate(o){
  const d=defaults();
  const s=Object.assign({},d.settings,o.settings||{});
  s.targets={train:Object.assign({},d.settings.targets.train,(o.settings&&o.settings.targets&&o.settings.targets.train)||{}),off:Object.assign({},d.settings.targets.off,(o.settings&&o.settings.targets&&o.settings.targets.off)||{})};
  if(!Array.isArray(s.week)||s.week.length!==7)s.week=d.settings.week;
  o.settings=s;
  ['exercises','menus','body','foods','workouts'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=d[k]});
  if(!o.meals||typeof o.meals!=='object')o.meals={};
  if(!o.days||typeof o.days!=='object')o.days={};
  Object.keys(o.days).forEach(d=>{const x=o.days[d];if(!x||!x.habits)return;ROUTINE.forEach(r=>{const h=x.habits[r.id];if(h&&h.actual){(x.log||(x.log=[])).push({id:uid(),time:h.actual,text:r.label});delete h.actual}})});
  o.v=1;return o;
}
let S=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));storeOK=true}
  catch(e){storeOK=false;toast('保存できませんでした。容量不足かプライベートモードの可能性があります')}
}
const Dr=d=>S.days[d]||{habits:{},water:0};
const Dw=d=>S.days[d]||(S.days[d]={habits:{},water:0});
const dayType=d=>(S.days[d]&&S.days[d].type)||S.settings.week[toDate(d).getDay()].type;
const tgt=d=>S.settings.targets[dayType(d)];
function menuFor(d){
  if(dayType(d)!=='train')return null;
  const id=(S.days[d]&&S.days[d].menuId)||S.settings.week[toDate(d).getDay()].menuId;
  return S.menus.find(m=>m.id===id)||null;
}
function totals(d){const t={kcal:0,p:0,f:0,c:0,n:0,est:0};(S.meals[d]||[]).forEach(m=>{t.kcal+=m.kcal||0;t.p+=m.p||0;t.f+=m.f||0;t.c+=m.c||0;t.n++;if(m.est)t.est++});return t}
const bodySorted=()=>S.body.slice().sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1);
function latest(field,d){const a=bodySorted().filter(r=>r.date<=d&&r[field]!=null);return a.length?a[a.length-1][field]:null}
function daily(field){const m={};bodySorted().forEach(r=>{if(r[field]!=null)m[r.date]=r[field]});return m}
function avgRange(field,from,to,m){m=m||daily(field);const v=Object.keys(m).filter(d=>d>=from&&d<=to).map(d=>m[d]);return v.length?{avg:v.reduce((a,b)=>a+b,0)/v.length,n:v.length}:null}
const habit=(d,id)=>Dr(d).habits[id]||{};
const QUICK=['起床','筋トレ','プロテイン','ウォーキング','出勤','昼食','間食','退勤','夕食','入浴','就寝'];
const nowHM=()=>{const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())};
const logOf=d=>(Dr(d).log||[]).slice().sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0);
const logHas=(d,ws)=>(Dr(d).log||[]).some(l=>ws.some(w=>l.text.includes(w)));
function tasks(d){
  const tr=dayType(d)==='train';
  return [
    {id:'weigh',label:'体重測定',done:S.body.some(b=>b.date===d),auto:'body'},
    {id:'protein',label:'プロテイン摂取',done:!!habit(d,'protein').done||logHas(d,['プロテイン'])},
    {id:'train',label:tr?'筋トレ':'休養',done:!!habit(d,'train').done||(tr&&S.workouts.some(w=>w.date===d))||logHas(d,tr?['筋トレ']:['休養'])},
    {id:'meal',label:'食事記録',done:(S.meals[d]||[]).length>0,auto:'meals'},
    {id:'walk',label:'ウォーキング',done:!!habit(d,'walk').done||logHas(d,['ウォーキング','散歩'])},
    {id:'sleep',label:'就寝時間',done:!!habit(d,'sleep').done||logHas(d,['就寝'])}];
}
const exById=id=>S.exercises.find(e=>e.id===id);
const exName=w=>{const e=exById(w.exId);return e?e.name:(w.name||'削除済みの種目')};

/* ---------- 画面状態 ---------- */
let tab='home',cur=today(),subT='today',subB='log',range=30,histEx=null,ctx={},askCb=null;
const NAV=[['home','ホーム','<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],
 ['meals','食事','<path d="M7 3v7a2 2 0 0 0 2 2v9M5 3v5M9 3v5M17 3c-2 2-3 4-3 7h3v11"/>'],
 ['train','トレーニング','<path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/>'],
 ['body','体重・分析','<path d="M4 20V4M4 20h16M7 15l4-5 3 3 5-7"/>'],
 ['settings','設定','<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>']];
function render(){
  $('#nav').innerHTML=NAV.map(n=>`<button data-act="tab" data-t="${n[0]}" class="${tab===n[0]?'on':''}"><svg viewBox="0 0 24 24">${n[2]}</svg>${n[1]}</button>`).join('');
  $('#datebar').innerHTML=tab==='settings'?'':`<button data-act="day" data-n="-1" aria-label="前の日">‹</button><div class="d">${fmtDate(cur)}<input type="date" id="curDate" data-chg="cur" value="${cur}" aria-label="日付を選ぶ"></div><button data-act="day" data-n="1" aria-label="次の日">›</button>${cur!==today()?'<button class="t" data-act="today">今日</button>':''}`;
  $('#view').innerHTML=(storeOK?'':'<div class="banner">このブラウザでは保存ができない状態です。記録は閉じると消える可能性があります。</div>')+VIEW[tab]();
}
const bar=(c,t)=>`<div class="bar"><i class="${c>t?'over':''}" style="width:${t>0?Math.min(100,c/t*100):0}%"></i></div>`;
const stat=(l,v,u)=>`<div class="stat"><small>${l}</small><span class="num">${v==null?'–':v}</span>${v==null?'':`<span class="u">${u||''}</span>`}</div>`;
function ring(done,total){
  const r=50,c=2*Math.PI*r,p=total?done/total:0;
  return `<div class="ring"><svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="9"/><circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg><div class="c"><span class="num">${Math.round(p*100)}<span style="font-size:14px">%</span></span><small>${done}/${total} 完了</small></div></div>`;
}
const VIEW={};

/* ---------- ホーム ---------- */
VIEW.home=()=>{
  const tk=tasks(cur),done=tk.filter(t=>t.done).length,tr=dayType(cur)==='train',mn=menuFor(cur);
  const w=latest('weight',cur),fat=latest('fat',cur),mus=latest('muscle',cur),bmr=latest('bmr',cur),st=S.settings;
  const bmi=w?r1(w/Math.pow(st.height/100,2)):null,rest=w!=null?r1(w-st.goalWeight):null;
  const t=totals(cur),g=tgt(cur),burn=bmr?bmr*(tr?st.factorTrain:st.factorOff):null,water=Dr(cur).water||0;
  const wk=S.workouts.filter(x=>x.date===cur).length;
  return `
  <section class="card hero">${ring(done,tk.length)}<div><h1>${tr?'筋トレ日':'オフ日'}</h1><p>${tr?(mn?esc(mn.name):'メニュー未設定'):'休養して回復にあてる日'}</p><p style="margin-top:8px">${done===tk.length?'今日のタスクは全部完了':`残り ${tk.length-done} タスク`}</p></div></section>
  <section class="card"><div class="h">身体データ<button class="more" data-act="bodyAdd">測定を記録</button></div>
    <div class="grid3">${stat('現在体重',w,'kg')}${stat('目標体重',st.goalWeight,'kg')}${stat('目標まで',rest==null?null:(rest>0?rest:'達成'),rest>0?'kg':'')}${stat('体脂肪率',fat,'%')}${stat('筋肉量',mus,'kg')}${stat('BMI',bmi,'')}</div>
    ${w==null?'<p class="empty">この日までの測定記録がありません</p>':''}</section>
  <section class="card"><div class="h">本日の進捗<button class="more" data-act="tab" data-t="meals">食事を記録</button></div>
    <div class="kcal"><div><span class="num">${kc(t.kcal)}</span> <span>/ ${kc(g.kcal)} kcal 摂取</span></div><span>消費 ${burn?kc(burn)+' kcal':'–'} <span class="tag est">推定</span></span></div>
    <div style="margin-top:10px">${bar(t.kcal,g.kcal)}</div>
    <div class="macro">${[['たんぱく質','p'],['脂質','f'],['炭水化物','c']].map(a=>`<div class="l">${a[0]}</div><div><div class="v"><span><b>${r1(t[a[1]])}</b> / ${g[a[1]]}g</span><span>${Math.round(g[a[1]]?t[a[1]]/g[a[1]]*100:0)}%</span></div>${bar(t[a[1]],g[a[1]])}</div>`).join('')}
      <div class="l">水分</div><div><div class="v"><span><b>${kc(water)}</b> / ${kc(st.waterGoal)}ml</span><span>${Math.round(st.waterGoal?water/st.waterGoal*100:0)}%</span></div>${bar(water,st.waterGoal)}</div></div>
    <div class="btns" style="margin-top:12px"><button class="btn sm" data-act="water" data-n="200">＋200ml</button><button class="btn sm" data-act="water" data-n="500">＋500ml</button><button class="btn sm" data-act="water" data-n="-200">−200ml</button></div>
    <div class="kv" style="margin-top:12px;border-top:1px solid var(--line)"><span>運動</span><b style="font-family:var(--body);font-size:14px">${tr?(wk?`${wk}件 記録済み`:'未実施'):(habit(cur,'train').done?'休養 済み':'オフ日')}</b></div></section>
  <section class="card"><div class="h">本日のタスク</div><div class="list">${tk.map(x=>`<button class="item" data-act="task" data-id="${x.id}"><span class="check ${x.done?'on':''}">✓</span><span class="g"><b>${x.label}</b>${x.auto?`<small>${x.auto==='body'?'測定を記録すると完了':'食事を1件記録すると完了'}</small>`:''}</span></button>`).join('')}</div></section>
  <section class="card"><div class="h">今日の記録（日記）<span>${logOf(cur).length}件</span></div>
    <div style="display:grid;grid-template-columns:104px 1fr;gap:8px"><input class="inp" type="time" id="lg_time" value="${cur===today()?nowHM():''}" aria-label="時刻"><input class="inp" type="text" id="lg_text" placeholder="やったこと" aria-label="やったこと" enterkeyhint="done"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">${QUICK.map(q=>`<button class="chip" data-act="logQuick" data-t="${q}">${q}</button>`).join('')}</div>
    <button class="btn pri wide" data-act="logAdd">記録に追加</button>
    ${logOf(cur).length?`<div class="list" style="margin-top:12px">${logOf(cur).map(l=>`<button class="item" data-act="logEdit" data-id="${l.id}"><span class="time" style="width:52px;color:var(--accent)">${esc(l.time||'--:--')}</span><span class="g"><b style="font-weight:500">${esc(l.text)}</b></span></button>`).join('')}</div>`:'<p class="empty">まだ記録がありません。時刻とやったことを入れて追加してください。</p>'}
    <p class="note">時刻の早い順に上から並びます。「プロテイン」「ウォーキング」「就寝」「筋トレ」「休養」を含む記録は、上のタスクも自動で完了になります。</p></section>`;
};

/* ---------- 食事 ---------- */
VIEW.meals=()=>{
  const t=totals(cur),g=tgt(cur),tr=dayType(cur)==='train',list=S.meals[cur]||[];
  const adv=[];
  if(t.kcal>g.kcal)adv.push(['カロリーが目標を '+kc(t.kcal-g.kcal)+'kcal 上回っています','次の食事は脂質を控えめにして、たんぱく質中心にすると調整しやすいです。']);
  if(t.f>g.f)adv.push(['脂質が目標を '+r1(t.f-g.f)+'g 上回っています','揚げ物・ドレッシング・ナッツ類の量を見直すと下げやすい栄養素です。']);
  if(t.c>g.c)adv.push(['炭水化物が目標を '+r1(t.c-g.c)+'g 上回っています','主食の量を少し減らすか、明日の間食で調整してみてください。']);
  if(t.p>g.p*1.15)adv.push(['たんぱく質は目標を超えました','不足はありません。その分のカロリーを他の栄養素で調整すると収まります。']);
  return `
  <section class="card"><div class="h">PFCバランス<button class="chip ${tr?'on':''}" data-act="toggleType">${tr?'筋トレ日':'オフ日'}（切替）</button></div>
    <div class="kcal"><div><span class="num">${kc(t.kcal)}</span> <span>/ ${kc(g.kcal)} kcal</span></div><span>${t.kcal<=g.kcal?'残り '+kc(g.kcal-t.kcal):'超過 '+kc(t.kcal-g.kcal)} kcal・${Math.round(t.kcal/g.kcal*100)}%</span></div>
    <div style="margin-top:10px">${bar(t.kcal,g.kcal)}</div>
    <div class="macro">${[['たんぱく質','p'],['脂質','f'],['炭水化物','c']].map(a=>{const c=t[a[1]],x=g[a[1]];return `<div class="l">${a[0]}</div><div><div class="v"><span><b>${r1(c)}</b> / ${x}g</span><span>${c<=x?'残り '+r1(x-c)+'g':'超過 '+r1(c-x)+'g'}・${Math.round(x?c/x*100:0)}%</span></div>${bar(c,x)}</div>`}).join('')}</div>
    ${t.est?`<p class="note">合計には推定値の食品が ${t.est} 件含まれます。</p>`:''}
    ${adv.map(a=>`<div class="adv amber"><b>${a[0]}</b><p>${a[1]}</p></div>`).join('')}</section>
  ${SLOTS.map(s=>{const it=list.filter(m=>m.slot===s.id),sub=it.reduce((a,m)=>a+(m.kcal||0),0);return `
  <section class="card"><div class="h"><span>${s.n}　${it.length?kc(sub)+' kcal':''}</span><button class="plus" data-act="mealAdd" data-slot="${s.id}" aria-label="${s.n}に追加">＋</button></div>
    ${it.length?`<div class="list">${it.map(m=>`<button class="item" data-act="mealEdit" data-id="${m.id}">${m.img?`<img src="${m.img}" alt="">`:''}<span class="g"><b>${esc(m.name)} ${m.est?'<span class="tag est">推定</span>':''}</b><small>${esc(m.amount||'')}　P${r1(m.p||0)} F${r1(m.f||0)} C${r1(m.c||0)}</small></span><span class="r"><span class="num">${kc(m.kcal||0)}</span>kcal</span></button>`).join('')}</div>`:'<p class="empty">まだ記録がありません</p>'}
  </section>`}).join('')}
  <button class="btn wide" data-act="foodList">食品リストを管理（${S.foods.length}件）</button>`;
};
function foodPick(q){
  q=(q||'').trim().toLowerCase();
  const a=S.foods.filter(f=>!q||f.name.toLowerCase().includes(q)).sort((x,y)=>(y.used||0)-(x.used||0)).slice(0,40);
  return a.length?a.map(f=>`<button type="button" data-act="pickFood" data-id="${f.id}">${esc(f.name)}<small>${esc(f.amount||'')}　${kc(f.kcal||0)}kcal・P${r1(f.p||0)} F${r1(f.f||0)} C${r1(f.c||0)}</small></button>`).join(''):'<p class="empty" style="padding:10px 12px">該当する食品がありません</p>';
}
const fld=(id,label,val,type,attr)=>`<label class="fld"><span>${label}</span><input id="${id}" type="${type||'text'}" value="${esc(val==null?'':val)}" ${type==='number'?'inputmode="decimal" step="any"':''} ${attr||''}></label>`;
function mealSheet(m){
  openSheet(m.id?'食事を編集':SLOTS.find(s=>s.id===m.slot).n+'に追加',`
    ${S.foods.length&&!m.id?`<label class="fld"><span>過去の食品から選ぶ</span><input id="fq" type="search" placeholder="食品名で検索" data-inp="fq"></label><div class="picklist" id="fl">${foodPick('')}</div>`:''}
    ${fld('m_name','食品名',m.name)}
    ${fld('m_amount','摂取量（例：100g、1個）',m.amount)}
    <div class="grid2">${fld('m_kcal','カロリー kcal',m.kcal,'number')}${fld('m_p','たんぱく質 g',m.p,'number')}${fld('m_f','脂質 g',m.f,'number')}${fld('m_c','炭水化物 g',m.c,'number')}</div>
    ${m.id?'':fld('m_mult','数量（何倍食べたか）',1,'number')}
    <label class="fld"><span>区分</span><select id="m_slot">${SLOTS.map(s=>`<option value="${s.id}" ${s.id===m.slot?'selected':''}>${s.n}</option>`).join('')}</select></label>
    <label class="ck"><input type="checkbox" id="m_est" ${m.est?'checked':''}>栄養値は推定（外食の目分量など）</label>

    <div id="m_prev">${m.img?`<img src="${m.img}" alt="" style="width:96px;border-radius:12px"> <button class="btn sm" data-act="imgClear">写真を外す</button>`:''}</div>

    <div class="btns" style="margin-top:14px">${m.id?'<button class="btn danger" data-act="mealDel">削除</button>':''}<button class="btn pri" data-act="mealSave">保存</button></div>`);
}

/* ---------- トレーニング ---------- */
const bestOf=a=>a.slice().sort((x,y)=>((y.weight||0)-(x.weight||0))||((y.reps||0)-(x.reps||0)))[0];
function prevRec(exId,date){
  const a=S.workouts.filter(x=>x.exId===exId&&x.date<date);if(!a.length)return null;
  const d=a.map(x=>x.date).sort().pop();return bestOf(a.filter(x=>x.date===d));
}
function diffTag(w){
  const p=prevRec(w.exId,w.date);if(!p)return '<span class="tag">初回</span>';
  const dw=r1((w.weight||0)-(p.weight||0)),dr=(w.reps||0)-(p.reps||0),ds=(w.sets||0)-(p.sets||0),parts=[];
  if(dw)parts.push(sg(dw)+'kg');if(dr)parts.push(sg(dr)+'回');if(ds)parts.push(sg(ds)+'セット');
  const up=dw>0||(dw===0&&dr>0)||(dw===0&&dr===0&&ds>0);
  return up?`<span class="tag up">▲ ${parts.join(' ')}</span>`:`<span class="tag">${parts.length?parts.join(' '):'前回と同じ'}</span>`;
}
const wLine=w=>`${w.weight||0}kg × ${w.reps||0}回 × ${w.sets||0}セット`;
function exCard(e){
  const p=prevRec(e.id,cur),td=S.workouts.filter(w=>w.exId===e.id&&w.date===cur);
  const warn=S.settings.shoulderPain&&e.shoulder;
  return `<section class="card"><div class="h" style="margin-bottom:6px"><span style="color:var(--text);font-size:15px;letter-spacing:0">${esc(e.name)}</span><button class="plus" data-act="wAdd" data-ex="${e.id}" aria-label="${esc(e.name)}を記録">＋</button></div>
    ${warn?'<p style="margin:0 0 6px"><span class="chip amber">肩に注意：痛みが出たら中止、重量を下げるか別の種目に</span></p>':''}
    <p class="note" style="margin-top:0">前回：${p?`${wLine(p)}（${md(p.date)}）`:'記録なし'}</p>
    ${td.length?`<div class="list" style="margin-top:6px">${td.map(w=>`<button class="item" data-act="wEdit" data-id="${w.id}"><span class="g"><b class="num" style="font-size:17px">${wLine(w)}</b>${w.memo?`<small>${esc(w.memo)}</small>`:''}</span>${diffTag(w)}</button>`).join('')}</div>`:''}</section>`;
}
VIEW.train=()=>{
  const seg=`<div class="seg">${[['today','記録'],['hist','履歴'],['menu','メニュー']].map(a=>`<button data-act="subT" data-s="${a[0]}" class="${subT===a[0]?'on':''}">${a[1]}</button>`).join('')}</div>`;
  if(subT==='today'){
    const tr=dayType(cur)==='train',mn=menuFor(cur);
    const inMenu=mn?mn.ex.map(exById).filter(Boolean):[];
    const extra=[...new Set(S.workouts.filter(w=>w.date===cur&&!inMenu.some(e=>e.id===w.exId)).map(w=>w.exId))].map(id=>exById(id)||{id,name:exName({exId:id,name:(S.workouts.find(w=>w.exId===id)||{}).name}),shoulder:false});
    return seg+`<section class="card"><div class="h" style="margin-bottom:8px">${fmtDate(cur)}のメニュー<button class="chip ${tr?'on':''}" data-act="toggleType">${tr?'筋トレ日':'オフ日'}（切替）</button></div>
      <div style="font-size:19px;font-weight:600">${tr?(mn?esc(mn.name):'メニュー未設定'):'オフ（休養）'}</div>
      ${tr?`<label class="fld" style="margin:10px 0 0"><span>この日のメニューを変える</span><select id="dayMenu" data-chg="dayMenu">${S.menus.map(m=>`<option value="${m.id}" ${mn&&mn.id===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>`:''}
      <label class="ck" style="margin-top:8px"><input type="checkbox" id="sh" data-chg="shoulder" ${S.settings.shoulderPain?'checked':''}>肩に痛みがある（該当種目に注意を表示）</label></section>
      ${inMenu.map(exCard).join('')}${extra.map(exCard).join('')}
      ${tr&&!inMenu.length&&!extra.length?'<p class="empty">このメニューには種目がありません。「メニュー」から追加できます。</p>':''}
      <button class="btn wide" data-act="wPick">メニュー外の種目を記録</button>`;
  }
  if(subT==='hist'){
    const used=S.exercises.slice();
    if(!histEx||!used.some(e=>e.id===histEx)){const last=S.workouts.slice().sort((a,b)=>a.date<b.date?1:-1)[0];histEx=last&&exById(last.exId)?last.exId:(used[0]&&used[0].id)}
    const rec=S.workouts.filter(w=>w.exId===histEx).sort((a,b)=>a.date<b.date?1:-1);
    const m={};rec.forEach(w=>{if(m[w.date]==null||(w.weight||0)>m[w.date])m[w.date]=w.weight||0});
    const ds=Object.keys(m).sort();
    return seg+`<section class="card"><label class="fld" style="margin:0"><span>種目</span><select id="histSel" data-chg="histEx">${used.map(e=>`<option value="${e.id}" ${e.id===histEx?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label></section>
      <section class="card"><div class="h">最大重量の推移</div>${ds.length>1?lineChart(ds.map(d=>({d,v:m[d]})),ds[0],ds[ds.length-1],'kg',null):'<p class="empty">2日分以上の記録でグラフを表示します</p>'}</section>
      <section class="card"><div class="h">記録（${rec.length}件）</div>${rec.length?`<div class="list">${rec.map(w=>`<button class="item" data-act="wEdit" data-id="${w.id}"><span class="g"><b class="num" style="font-size:17px">${wLine(w)}</b><small>${fmtDate(w.date)}${w.memo?'　'+esc(w.memo):''}</small></span>${diffTag(w)}</button>`).join('')}</div>`:'<p class="empty">この種目の記録はまだありません</p>'}</section>`;
  }
  return seg+S.menus.map(m=>`<section class="card"><div class="h"><span style="color:var(--text);font-size:15px;letter-spacing:0">${esc(m.name)}</span><button class="more" data-act="menuEdit" data-id="${m.id}">名前・削除</button></div>
    ${m.ex.length?`<div class="list">${m.ex.map(id=>{const e=exById(id);return e?`<div class="item"><span class="g"><b>${esc(e.name)}</b></span><button class="btn sm danger" data-act="menuExDel" data-id="${m.id}" data-ex="${id}">外す</button></div>`:''}).join('')}</div>`:'<p class="empty">種目がありません</p>'}
    <label class="fld" style="margin:10px 0 0"><span>種目を追加</span><select id="add_${m.id}" data-chg="menuExAdd" data-id="${m.id}"><option value="">選んでください</option>${S.exercises.filter(e=>!m.ex.includes(e.id)).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label></section>`).join('')+
    `<button class="btn wide" data-act="menuEdit" data-id="" style="margin-bottom:12px">メニューを新しく作る</button>
    <section class="card"><div class="h">種目リスト<button class="more" data-act="exEdit" data-id="">種目を追加</button></div><div class="list">${S.exercises.map(e=>`<button class="item" data-act="exEdit" data-id="${e.id}"><span class="g"><b>${esc(e.name)}</b></span>${e.shoulder?'<span class="tag est">肩を使う</span>':''}</button>`).join('')}</div>
    <p class="note">曜日ごとの割り当ては「設定」の週間スケジュールで変えられます。</p></section>`;
};

/* ---------- グラフ ---------- */
function lineChart(pts,from,to,unit,avgPts){
  const W=320,H=140,L=32,R=30,T=12,B=20,n=Math.max(1,Math.round((toDate(to)-toDate(from))/864e5));
  const x=d=>L+(W-L-R)*Math.round((toDate(d)-toDate(from))/864e5)/n;
  const all=pts.map(p=>p.v).concat((avgPts||[]).map(p=>p.v));
  let lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
  if(hi-lo<1){const mid=(hi+lo)/2;lo=mid-.5;hi=mid+.5}
  const pv=(hi-lo)*.15;lo-=pv;hi+=pv;
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const main=avgPts||pts,path=main.map((p,i)=>(i?'L':'M')+x(p.d).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const last=main[main.length-1],lx=x(last.d),ly=y(last.v);
  const area=main.length>1?`<path d="${path} L${lx.toFixed(1)} ${H-B} L${x(main[0].d).toFixed(1)} ${H-B} Z" fill="var(--accent)" opacity=".08"/>`:'';
  const grid=[lo+pv,(lo+hi)/2,hi-pv].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${r1(v)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="推移グラフ">${grid}${area}
    ${avgPts?pts.map(p=>`<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2" fill="var(--muted)"/>`).join(''):''}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${avgPts?'':pts.map(p=>`<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.2" fill="var(--accent)"/>`).join('')}
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${Math.min(W-2,lx+6).toFixed(1)}" y="${(ly-7).toFixed(1)}" text-anchor="${lx>W-R-10?'end':'start'}" style="fill:var(--text);font-size:10px">${r1(last.v)}${unit}</text>
    <text x="${L}" y="${H-5}">${md(from)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${md(to)}</text></svg>`;
}
function bodyChart(field,unit,withAvg){
  const to=cur,from=addDays(cur,-(range-1)),m=daily(field);
  const ds=Object.keys(m).filter(d=>d>=from&&d<=to).sort();
  if(!ds.length)return '<p class="empty">この期間の記録はありません</p>';
  const pts=ds.map(d=>({d,v:m[d]}));
  const avg=withAvg?ds.map(d=>({d,v:avgRange(field,addDays(d,-6),d,m).avg})):null;
  const first=(avg||pts)[0].v,last=(avg||pts)[pts.length-1].v;
  return lineChart(pts,from,to,unit,avg)+`<p class="legend">${withAvg?'線＝7日平均　点＝日々の値　':''}期間内の変化 ${sg(r1(last-first))}${unit}（記録 ${ds.length}日）</p>`;
}

/* ---------- 週間レポート・分析 ---------- */
function weekStats(mon){
  const end=addDays(mon,6),td=today(),days=[];
  for(let i=0;i<7;i++){const d=addDays(mon,i);if(d<=td)days.push(d)}
  const logged=days.filter(d=>(S.meals[d]||[]).length),sum={kcal:0,p:0,f:0,c:0};
  logged.forEach(d=>{const t=totals(d);for(const k in sum)sum[k]+=t[k]});
  const n=logged.length;let planned=0,done=0;
  for(let i=0;i<7;i++)if(dayType(addDays(mon,i))==='train')planned++;
  days.forEach(d=>{done+=tasks(d).filter(t=>t.done).length});
  const ws=S.workouts.filter(w=>w.date>=mon&&w.date<=end),lifts=[];
  [...new Set(ws.map(w=>w.exId))].forEach(id=>{const b=bestOf(ws.filter(w=>w.exId===id)),p=prevRec(id,mon);if(p)lifts.push({name:exName(b),from:p.weight||0,to:b.weight||0})});
  return {mon,end,days:days.length,w:avgRange('weight',mon,end),fat:avgRange('fat',mon,end),waist:avgRange('waist',mon,end),muscle:avgRange('muscle',mon,end),
    n,avg:n?{kcal:sum.kcal/n,p:sum.p/n,f:sum.f/n,c:sum.c/n}:null,sess:new Set(ws.map(w=>w.date)).size,planned,
    habit:days.length?done/(days.length*6)*100:null,weighDays:days.filter(d=>S.body.some(b=>b.date===d)).length,lifts};
}
function weekGoals(a){
  const g=[],tp=S.settings.targets.train.p;
  if(a.n<a.days||!a.n)g.push(`食事記録を毎日つける（今週 ${a.n}/${a.days||7}日）`);
  if(a.avg&&a.avg.p<tp*.9)g.push(`たんぱく質を平均 ${Math.round(a.avg.p)}g → ${tp}g に近づける`);
  if(a.sess<a.planned)g.push(`筋トレを予定どおり週${a.planned}回こなす（今週 ${a.sess}回）`);
  if(a.weighDays<a.days||!a.weighDays)g.push(`毎朝の体重測定を続ける（今週 ${a.weighDays}/${a.days||7}日）`);
  if(a.avg&&a.avg.kcal>(S.settings.targets.train.kcal+S.settings.targets.off.kcal)/2*1.05)g.push(`平均摂取カロリーを目標範囲に収める（今週 平均${kc(a.avg.kcal)}kcal）`);
  if(a.habit!=null&&a.habit<80)g.push(`習慣タスクの達成率を80%以上に（今週 ${Math.round(a.habit)}%）`);
  ['今週のペースをそのまま維持する','就寝時間を22時までに収める','水分を目標量まで飲む'].forEach(x=>{if(g.length<3)g.push(x)});
  return g.slice(0,3);
}
function advise(d){
  const A=[],t=totals(d),g=tgt(d),bmr=latest('bmr',d);
  const prot=S.foods.filter(f=>f.p>=10&&f.kcal>0).sort((x,y)=>y.p/y.kcal-x.p/x.kcal);
  if(!t.n)A.push({tag:'情報',h:'食事の記録がまだありません',b:'この日の食事を記録すると、PFCの過不足を分析できます。'});
  else{
    const src=t.est?'推定値を含む':'記録値';
    const pr=g.p-t.p;
    if(pr>10)A.push({tag:src,h:`たんぱく質があと ${Math.round(pr)}g 不足`,b:prot.length?`食品リストの「${prot[0].name}」（${prot[0].amount||'1食'}）で P ${r1(prot[0].p)}g・${kc(prot[0].kcal)}kcal 補えます。`:'高たんぱくの食品を食品リストに登録すると、ここで候補を出せます。'});
    else A.push({tag:src,h:'たんぱく質は目標に届いています',b:`${r1(t.p)}g / ${g.p}g。`});
    const kd=t.kcal-g.kcal;
    if(kd>0)A.push({tag:src,h:`カロリーが ${kc(kd)}kcal 超過`,b:'1日の超過は週平均でならせます。翌日以降の脂質・炭水化物で少しずつ調整してください。',amber:1});
    else if(d<today()&&bmr&&t.kcal<bmr)A.push({tag:src,h:`摂取 ${kc(t.kcal)}kcal が基礎代謝 ${kc(bmr)}kcal を下回っています`,b:'記録漏れでなければ、筋肉量の維持のために食事量を増やすことを検討してください。',amber:1});
    else A.push({tag:src,h:`カロリーは目標内（残り ${kc(-kd)}kcal）`,b:`${kc(t.kcal)} / ${kc(g.kcal)}kcal。`});
  }
  const tm=addDays(d,1),tg=tgt(tm);
  A.push({tag:'情報',h:`翌日 ${fmtDate(tm)} は${dayType(tm)==='train'?'筋トレ日':'オフ日'}`,b:`目標 ${kc(tg.kcal)}kcal・P${tg.p}g F${tg.f}g C${tg.c}g。4回の食事で均等に分けると1回あたり P 約${Math.round(tg.p/4)}g です。${prot.length?'登録済みの高たんぱく食品：'+prot.slice(0,3).map(f=>f.name).join('、'):''}`});
  const m=monday(d),w0=avgRange('weight',m,addDays(m,6)),w1=avgRange('weight',addDays(m,-7),addDays(m,-1)),w2=avgRange('weight',addDays(m,-14),addDays(m,-8));
  if(!w0||!w1||w0.n<3||w1.n<3)A.push({tag:'情報',h:'体重の傾向はまだ判定できません',b:`週平均の比較には今週と先週でそれぞれ3日以上の測定が必要です（今週 ${w0?w0.n:0}日・先週 ${w1?w1.n:0}日）。`});
  else{
    const dd=r1(w0.avg-w1.avg),base=`週平均 ${r1(w1.avg)}kg → ${r1(w0.avg)}kg（${sg(dd)}kg）。`;
    if(dd<=-w1.avg*.01)A.push({tag:'実測',h:'減量ペースが速めです',b:base+'判定基準：週に体重の1%以上の減少。筋肉量を保つには、たんぱく質を確保しつつカロリーを少し戻す選択肢があります。',amber:1});
    else if(dd<-.2)A.push({tag:'実測',h:'体重は順調に減っています',b:base+'判定基準：週平均で0.2kg超〜体重の1%未満の減少。'});
    else if(Math.abs(dd)<=.2){
      if(w2&&w2.n>=3&&Math.abs(w1.avg-w2.avg)<=.2)A.push({tag:'実測',h:'停滞の可能性があります（2週連続で横ばい）',b:base+'判定基準：週平均の変化が±0.2kg以内。食事記録の漏れ、摂取カロリー、歩数を順に確認してください。',amber:1});
      else A.push({tag:'実測',h:'今週は横ばいです',b:base+'1週だけの横ばいは水分量の変動でも起こります。もう1週様子を見てください。'});
    }else A.push({tag:'実測',h:'体重が増えています',b:base+'食事記録の平均カロリーと照らし合わせて確認してください。',amber:1});
  }
  const mu0=avgRange('muscle',m,addDays(m,6)),mu1=avgRange('muscle',addDays(m,-7),addDays(m,-1));
  if(mu0&&mu1&&mu1.avg-mu0.avg>=.5)A.push({tag:'推定',h:`筋肉量が週平均で ${r1(mu1.avg-mu0.avg)}kg 減少`,b:'体組成計の筋肉量は推定値で、水分量でも変動します。傾向が続く場合はカロリーとたんぱく質を見直してください。',amber:1});
  const a=weekStats(m);
  A.push({tag:'実測',h:`今週の筋トレ ${a.sess}/${a.planned}回`,b:a.sess>=a.planned?'予定回数に届いています。':'残りの予定日で実施できるか、スケジュールを確認してください。'});
  const stall=[];
  S.exercises.forEach(e=>{const r=S.workouts.filter(w=>w.exId===e.id),ds=[...new Set(r.map(w=>w.date))].sort().slice(-3);
    if(ds.length===3){const b=ds.map(x=>bestOf(r.filter(w=>w.date===x)));if(b.every(x=>x.weight===b[0].weight&&x.reps===b[0].reps))stall.push(e.name)}});
  if(stall.length)A.push({tag:'実測',h:'3回連続で記録が同じ種目があります',b:`${stall.join('、')}。重量を据え置いて回数を1回増やすか、セット数で調整する方法があります。`});
  const sl=[];for(let i=0;i<7;i++){const x=(Dr(addDays(d,-i)).log||[]).find(l=>l.text.includes('就寝')&&l.time);if(x)sl.push(x.time)}
  if(sl.length){const late=sl.filter(x=>x>'22:00'||x<'04:00').length;A.push({tag:'実測',h:`就寝時刻：直近7日で記録 ${sl.length}日・22時より遅い日 ${late}日`,b:late?'睡眠が短いと回復と食欲の調整に影響しやすいので、就寝目標を守れる日を増やしてください。':'就寝目標を守れています。'})}
  else A.push({tag:'情報',h:'睡眠は判定できません',b:'ホームの「今日の記録」に「就寝」を時刻つきで入れると分析できます。'});
  let walk=0;for(let i=0;i<7;i++)if(tasks(addDays(d,-i))[4].done)walk++;
  A.push({tag:'実測',h:`ウォーキング：直近7日で ${walk}日`,b:'歩数の実測データは未接続のため、タスクの完了日数だけを見ています。'});
  return A;
}

    <div class="kv"><span>写真からの栄養推定</span><b style="font-family:var(--body);font-size:13px;color:var(--amber)">未接続</b></div>
    <div class="kv"><span>歩数・活動量の連携</span><b style="font-family:var(--body);font-size:13px;color:var(--amber)">未接続</b></div>
    <div class="kv"><span>バージョン</span><b>${VERSION}</b></div></section>`;
};

/* ---------- シート・トースト ---------- */
function openSheet(title,html){$('#shT').textContent=title;$('#shB').innerHTML=html;$('#ov').hidden=false}
function closeSheet(){$('#ov').hidden=true;$('#shB').innerHTML='';askCb=null}
function ask(msg,yes,cb){openSheet('確認',`<p style="margin:0 0 16px">${esc(msg)}</p><div class="btns"><button class="btn" data-act="close">やめる</button><button class="btn danger" data-act="askYes">${esc(yes)}</button></div>`);askCb=cb}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2400)}
const val=id=>{const e=$('#'+id);return e?e.value:''};
const chk=id=>{const e=$('#'+id);return !!(e&&e.checked)};
function download(name,text,type){
  const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
}
function readImg(file){return new Promise(res=>{const fr=new FileReader();fr.onerror=()=>res(null);fr.onload=()=>{const im=new Image();im.onerror=()=>res(null);im.onload=()=>{const s=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};im.src=fr.result};fr.readAsDataURL(file)})}
const csvRow=a=>a.map(v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',');

/* ---------- 操作 ---------- */
const ACT={
  tab(d){tab=d.t;render();window.scrollTo(0,0)},
  day(d){cur=addDays(cur,+d.n);render()},
  today(){cur=today();render()},
  close(){closeSheet()},
  askYes(){const f=askCb;closeSheet();if(f)f()},
  subT(d){subT=d.s;render()},
  subB(d){subB=d.s;render()},
  range(d){range=+d.n;render()},
  water(d){const x=Dw(cur);x.water=Math.max(0,(x.water||0)+(+d.n));save();render()},
  habit(d){const x=Dw(cur),h=x.habits[d.id]||(x.habits[d.id]={});h.done=!h.done;save();render()},
  logQuick(d){const t=$('#lg_text'),tm=$('#lg_time');t.value=d.t;if(!tm.value)tm.value=nowHM();ACT.logAdd()},
  logAdd(){const text=val('lg_text').trim();if(!text){toast('やったことを入れてください');return}
    const x=Dw(cur);(x.log||(x.log=[])).push({id:uid(),time:val('lg_time'),text});save();render();toast('記録しました')},
  logEdit(d){const l=(Dr(cur).log||[]).find(x=>x.id===d.id);if(!l)return;ctx={id:l.id};
    openSheet('記録を編集',`${fld('le_time','時刻',l.time,'time')}${fld('le_text','やったこと',l.text)}<div class="btns" style="margin-top:8px"><button class="btn danger" data-act="logDel">削除</button><button class="btn pri" data-act="logSave">保存</button></div>`)},
  logSave(){const text=val('le_text').trim();if(!text){toast('やったことを入れてください');return}
    const l=(Dw(cur).log||[]).find(x=>x.id===ctx.id);if(l){l.time=val('le_time');l.text=text}save();closeSheet();render()},
  logDel(){const x=Dw(cur);x.log=(x.log||[]).filter(l=>l.id!==ctx.id);save();closeSheet();render();toast('削除しました')},
  task(d){
    if(d.id==='weigh'){if(!S.body.some(b=>b.date===cur))ACT.bodyAdd();else{tab='body';subB='log';render()}return}
    if(d.id==='meal'){tab='meals';render();window.scrollTo(0,0);return}
    if(d.id==='train'&&dayType(cur)==='train'&&S.workouts.some(w=>w.date===cur)){tab='train';subT='today';render();return}
    ACT.habit({id:d.id});
  },
  toggleType(){const x=Dw(cur),now=dayType(cur),nx=now==='train'?'off':'train',base=S.settings.week[toDate(cur).getDay()].type;
    if(nx===base){delete x.type;delete x.menuId}else{x.type=nx;if(nx==='train'&&!x.menuId&&S.menus[0])x.menuId=S.menus[0].id}
    save();render();toast(`${fmtDate(cur)}を${nx==='train'?'筋トレ日':'オフ日'}にしました`)},
  /* 食事 */
  mealAdd(d){ctx={date:cur,slot:d.slot,id:null,img:null};mealSheet({slot:d.slot})},
  mealEdit(d){const m=(S.meals[cur]||[]).find(x=>x.id===d.id);if(!m)return;ctx={date:cur,slot:m.slot,id:m.id,img:m.img||null};mealSheet(m)},
  pickFood(d){const f=S.foods.find(x=>x.id===d.id);if(!f)return;[['m_name','name'],['m_amount','amount'],['m_kcal','kcal'],['m_p','p'],['m_f','f'],['m_c','c']].forEach(a=>{$('#'+a[0]).value=f[a[1]]==null?'':f[a[1]]});$('#m_est').checked=!!f.est;toast('値を入力しました。数量を確認して保存してください')},
  imgClear(){ctx.img=null;$('#m_prev').innerHTML='';const i=$('#m_img');if(i)i.value=''},
  mealSave(){
    const name=val('m_name').trim();if(!name){toast('食品名を入れてください');return}
    let kcal=num(val('m_kcal')),p=num(val('m_p'))||0,f=num(val('m_f'))||0,c=num(val('m_c'))||0,calc=false;
    if(kcal==null){kcal=Math.round(p*4+f*9+c*4);calc=true}
    const base={name,amount:val('m_amount').trim(),kcal,p,f,c,est:chk('m_est')};
    const list=S.meals[ctx.date]||(S.meals[ctx.date]=[]);
    if(ctx.id){const m=list.find(x=>x.id===ctx.id);Object.assign(m,base,{slot:val('m_slot'),img:ctx.img})}
    else{
      const k=num(val('m_mult'));const mult=k&&k>0?k:1;
      list.push({id:uid(),slot:val('m_slot'),name,amount:(base.amount+(mult!==1?` ×${mult}`:'')).trim(),kcal:r1(kcal*mult),p:r1(p*mult),f:r1(f*mult),c:r1(c*mult),est:base.est,img:ctx.img});
      if(chk('m_save')){const ex=S.foods.find(x=>x.name===name);if(ex)Object.assign(ex,base,{used:Date.now()});else S.foods.push(Object.assign({id:uid(),used:Date.now()},base))}
      else{const ex=S.foods.find(x=>x.name===name);if(ex)ex.used=Date.now()}
    }
    save();closeSheet();render();toast(calc?'保存しました（カロリーはPFCから計算）':'保存しました');
  },
  mealDel(){ask('この食事の記録を削除しますか？','削除する',()=>{S.meals[ctx.date]=(S.meals[ctx.date]||[]).filter(x=>x.id!==ctx.id);if(!S.meals[ctx.date].length)delete S.meals[ctx.date];save();render();toast('削除しました')})},
  foodList(){openSheet('食品リスト',S.foods.length?`<div class="list">${S.foods.slice().sort((a,b)=>(b.used||0)-(a.used||0)).map(f=>`<div class="item"><span class="g"><b>${esc(f.name)}</b><small>${esc(f.amount||'')}　${kc(f.kcal||0)}kcal・P${r1(f.p||0)} F${r1(f.f||0)} C${r1(f.c||0)}</small></span><button class="btn sm danger" data-act="foodDel" data-id="${f.id}">削除</button></div>`).join('')}</div>`:'<p class="empty">まだ食品が登録されていません。食事を記録すると自動でここに入ります。</p>')},
  foodDel(d){S.foods=S.foods.filter(f=>f.id!==d.id);save();ACT.foodList();render()},
  /* 体組成 */
  bodyAdd(){const n=new Date();ctx={id:null};bodySheet({date:cur,time:cur===today()?pad(n.getHours())+':'+pad(n.getMinutes()):''})},
  bodyEdit(d){const r=S.body.find(x=>x.id===d.id);if(!r)return;ctx={id:r.id};bodySheet(r)},
  bodySave(){
    const o={date:val('b_date')||cur,time:val('b_time'),weight:num(val('b_weight')),fat:num(val('b_fat')),muscle:num(val('b_muscle')),bmr:num(val('b_bmr')),waist:num(val('b_waist'))};
    if([o.weight,o.fat,o.muscle,o.bmr,o.waist].every(v=>v==null)){toast('測定値を1つ以上入れてください');return}
    if(ctx.id){const r=S.body.find(x=>x.id===ctx.id);Object.assign(r,o);delete r.initial}else S.body.push(Object.assign({id:uid()},o));
    save();closeSheet();render();toast('保存しました');
  },
  bodyDel(){ask('この測定記録を削除しますか？','削除する',()=>{S.body=S.body.filter(x=>x.id!==ctx.id);save();render();toast('削除しました')})},
  /* トレーニング */
  wAdd(d){const e=exById(d.ex);if(!e)return;const p=prevRec(e.id,addDays(cur,1))||{};ctx={id:null,exId:e.id};wSheet(e.name,{date:cur,weight:p.weight,reps:p.reps,sets:p.sets,memo:''},p.date?p:null)},
  wEdit(d){const w=S.workouts.find(x=>x.id===d.id);if(!w)return;ctx={id:w.id,exId:w.exId};wSheet(exName(w),w,prevRec(w.exId,w.date))},
  wPick(){openSheet('種目を選ぶ',`<div class="list">${S.exercises.map(e=>`<button class="item" data-act="wAdd" data-ex="${e.id}"><span class="g"><b>${esc(e.name)}</b></span>${e.shoulder&&S.settings.shoulderPain?'<span class="tag est">肩に注意</span>':''}</button>`).join('')}</div>`)},
  wSave(){
    const o={date:val('w_date')||cur,weight:num(val('w_weight'))||0,reps:num(val('w_reps'))||0,sets:num(val('w_sets'))||0,memo:val('w_memo').trim()};
    if(!o.reps&&!o.sets&&!o.weight){toast('重量・回数・セット数を入れてください');return}
    let w;if(ctx.id){w=S.workouts.find(x=>x.id===ctx.id);Object.assign(w,o)}else{const e=exById(ctx.exId);w=Object.assign({id:uid(),exId:ctx.exId,name:e?e.name:''},o);S.workouts.push(w)}
    const p=prevRec(w.exId,w.date),up=p&&((w.weight>p.weight)||(w.weight===p.weight&&w.reps>p.reps));
    save();closeSheet();render();toast(up?'前回より伸びました ▲':'保存しました');
  },
  wDel(){ask('このトレーニング記録を削除しますか？','削除する',()=>{S.workouts=S.workouts.filter(x=>x.id!==ctx.id);save();render();toast('削除しました')})},
  menuEdit(d){const m=S.menus.find(x=>x.id===d.id);ctx={id:m?m.id:null};openSheet(m?'メニューを編集':'メニューを作る',`${fld('mn_name','メニュー名',m?m.name:'')}<div class="btns" style="margin-top:8px">${m?'<button class="btn danger" data-act="menuDel">削除</button>':''}<button class="btn pri" data-act="menuSave">保存</button></div>`)},
  menuSave(){const n=val('mn_name').trim();if(!n){toast('メニュー名を入れてください');return}
    if(ctx.id)S.menus.find(x=>x.id===ctx.id).name=n;else S.menus.push({id:uid(),name:n,ex:[]});save();closeSheet();render()},
  menuDel(){ask('このメニューを削除しますか？過去のトレーニング記録は残ります。','削除する',()=>{const id=ctx.id;S.menus=S.menus.filter(x=>x.id!==id);S.settings.week.forEach(w=>{if(w.menuId===id)w.menuId=S.menus[0]?S.menus[0].id:null});save();render()})},
  menuExDel(d){const m=S.menus.find(x=>x.id===d.id);if(m){m.ex=m.ex.filter(x=>x!==d.ex);save();render()}},
  exEdit(d){const e=exById(d.id);ctx={id:e?e.id:null};openSheet(e?'種目を編集':'種目を追加',`${fld('ex_name','種目名',e?e.name:'')}<label class="ck"><input type="checkbox" id="ex_sh" ${e&&e.shoulder?'checked':''}>肩を使う種目（肩の痛みがあるとき注意を表示）</label><div class="btns" style="margin-top:10px">${e?'<button class="btn danger" data-act="exDel">削除</button>':''}<button class="btn pri" data-act="exSave">保存</button></div>`)},
  exSave(){const n=val('ex_name').trim();if(!n){toast('種目名を入れてください');return}
    if(ctx.id){const e=exById(ctx.id);e.name=n;e.shoulder=chk('ex_sh');S.workouts.forEach(w=>{if(w.exId===e.id)w.name=n})}else S.exercises.push({id:uid(),name:n,shoulder:chk('ex_sh')});
    save();closeSheet();render()},
  exDel(){ask('この種目を削除しますか？過去の記録は残ります。','削除する',()=>{const id=ctx.id;S.exercises=S.exercises.filter(x=>x.id!==id);S.menus.forEach(m=>{m.ex=m.ex.filter(x=>x!==id)});save();render()})},
  /* データ */
  backup(){download(`bodycontrol-backup-${today()}.json`,JSON.stringify(S,null,1),'application/json');toast('バックアップを書き出しました')},
  csv(d){
    let rows;
    if(d.k==='body')rows=[['日付','時刻','体重kg','体脂肪率%','筋肉量kg','基礎代謝kcal','ウエストcm']].concat(bodySorted().map(r=>[r.date,r.time,r.weight,r.fat,r.muscle,r.bmr,r.waist]));
    else if(d.k==='meals'){rows=[['日付','区分','食品名','摂取量','カロリーkcal','たんぱく質g','脂質g','炭水化物g','推定']];Object.keys(S.meals).sort().forEach(dt=>S.meals[dt].forEach(m=>rows.push([dt,(SLOTS.find(s=>s.id===m.slot)||{}).n,m.name,m.amount,m.kcal,m.p,m.f,m.c,m.est?'推定':''])))}
    else if(d.k==='log'){rows=[['日付','時刻','やったこと']];Object.keys(S.days).sort().forEach(dt=>logOf(dt).forEach(l=>rows.push([dt,l.time,l.text])))}
    else rows=[['日付','種目','重量kg','回数','セット数','メモ']].concat(S.workouts.slice().sort((a,b)=>a.date<b.date?-1:1).map(w=>[w.date,exName(w),w.weight,w.reps,w.sets,w.memo]));
    download(`bodycontrol-${d.k}-${today()}.csv`,'﻿'+rows.map(csvRow).join('\r\n'),'text/csv');toast('CSVを書き出しました');
  },
  wipe(){ask('すべての記録と設定を消して初期状態に戻します。元に戻せません。先にバックアップを取りましたか？','すべて消す',()=>{S=defaults();save();cur=today();render();toast('初期状態に戻しました')})}
};
function bodySheet(r){
  openSheet(ctx.id?'測定を編集':'測定を記録',`<div class="grid2">${fld('b_date','測定日',r.date,'date')}${fld('b_time','時刻',r.time,'time')}</div>
    <div class="grid2">${fld('b_weight','体重 kg',r.weight,'number')}${fld('b_fat','体脂肪率 %',r.fat,'number')}${fld('b_muscle','筋肉量 kg',r.muscle,'number')}${fld('b_bmr','基礎代謝 kcal',r.bmr,'number')}${fld('b_waist','ウエスト cm',r.waist,'number')}</div>
    <p class="note">空欄の項目は記録されません。</p>
    <div class="btns" style="margin-top:14px">${ctx.id?'<button class="btn danger" data-act="bodyDel">削除</button>':''}<button class="btn pri" data-act="bodySave">保存</button></div>`);
}
function wSheet(name,w,p){
  const e=exById(ctx.exId);
  openSheet(name,`${e&&e.shoulder&&S.settings.shoulderPain?'<div class="banner">肩に注意：痛みが出たら中止し、重量を下げるか別の種目に替えてください。</div>':''}
    <p class="note" style="margin:0 0 10px">前回：${p?`${wLine(p)}（${md(p.date)}）`:'記録なし'}</p>
    <div class="grid2">${fld('w_weight','重量 kg',w.weight,'number')}${fld('w_reps','回数',w.reps,'number')}${fld('w_sets','セット数',w.sets,'number')}${fld('w_date','実施日',w.date,'date')}</div>
    <label class="fld"><span>メモ</span><textarea id="w_memo">${esc(w.memo||'')}</textarea></label>
    <div class="btns" style="margin-top:8px">${ctx.id?'<button class="btn danger" data-act="wDel">削除</button>':''}<button class="btn pri" data-act="wSave">保存</button></div>`);
}
const CHG={
  cur(el){if(el.value){cur=el.value;render()}},
  shoulder(el){S.settings.shoulderPain=el.checked;save();render()},
  dayMenu(el){Dw(cur).menuId=el.value;save();render()},
  histEx(el){histEx=el.value;render()},
  menuExAdd(el){const m=S.menus.find(x=>x.id===el.dataset.id);if(m&&el.value&&!m.ex.includes(el.value)){m.ex.push(el.value);save();render()}},
  set(el){const n=num(el.value);if(n==null||n<0){toast('数値を入れてください');render();return}
    const ks=el.dataset.path.split('.');let o=S.settings;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=n;save();toast('保存しました')},
  weekType(el){const w=S.settings.week[+el.dataset.i];w.type=el.value;if(w.type==='train'&&!w.menuId)w.menuId=S.menus[0]?S.menus[0].id:null;save();render()},
  weekMenu(el){S.settings.week[+el.dataset.i].menuId=el.value;save();render()},
  mealImg(el){const f=el.files&&el.files[0];if(!f)return;readImg(f).then(u=>{if(!u){toast('画像を読み込めませんでした');return}ctx.img=u;const p=$('#m_prev');if(p)p.innerHTML=`<img src="${u}" alt="" style="width:96px;border-radius:12px"> <button class="btn sm" data-act="imgClear">写真を外す</button>`})},
  restore(el){const f=el.files&&el.files[0];if(!f)return;const fr=new FileReader();
    fr.onload=()=>{let o;try{o=JSON.parse(fr.result)}catch(e){toast('JSONとして読み込めませんでした');return}
      if(!o||typeof o!=='object'||!o.settings||!Array.isArray(o.body)){toast('BODY CONTROLのバックアップではありません');return}
      ask('今の記録をすべて、このバックアップの内容で置き換えます。よろしいですか？','置き換える',()=>{S=migrate(o);save();render();toast('復元しました')})};
    fr.readAsText(f);el.value=''}
};
document.addEventListener('click',e=>{
  if(e.target&&e.target.id==='ov'){closeSheet();return}
  const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el)}
});
document.addEventListener('change',e=>{const el=e.target;if(el&&el.dataset&&el.dataset.chg&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
document.addEventListener('input',e=>{const el=e.target;if(el&&el.dataset&&el.dataset.inp==='fq'){const l=$('#fl');if(l)l.innerHTML=foodPick(el.value)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='lg_text'){e.preventDefault();ACT.logAdd();return}if(e.key==='Escape'&&!$('#ov').hidden)closeSheet()});
if(!localStorage.getItem(KEY))save();
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
